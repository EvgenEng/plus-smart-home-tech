spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:/config
            - classpath:/config/commerce
            - classpath:/config/infra
            - classpath:/config/telemetry
            - classpath:/config/infra/gateway

server:
  port: 8888

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,gateway
  endpoint:
    health:
      show-details: always
    refresh:
      enabled: true
    gateway:
      enabled: true

logging:
  level:
    com.netflix.discovery: INFO
    org.springframework.cloud.netflix: INFO